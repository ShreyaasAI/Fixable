# M8/M9 DoD under gVisor (m8-contract §13 A5, m9-contract T9): the non-live suite with sandboxes
# on runsc, run as the default runner user (uid 1001).
# Runs on the private CI repo only. No repo secrets: `-m "not live"` needs none.
name: m8-gvisor

on:
  workflow_dispatch:
  push:
    branches: [feature/m8, feature/m9]

permissions:
  contents: read

concurrency:
  group: m8-gvisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor:
    # x86_64 hosted runner: arm64 runners are not free for private repos (A5).
    if: github.repository == 'ShreyaasAI/swf-ci'  # never on Fixable (no push before M9)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the test user can read .git/config

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install gVisor runsc (official apt repo, same as ops/vm-bootstrap.sh)
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$arch signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq runsc
          # Registers runsc in /etc/docker/daemon.json, keeping the runner's existing keys.
          # Default runtime stays runc; sandboxes pick runsc via SWF_SANDBOX_RUNTIME.
          sudo runsc install
          sudo systemctl restart docker
          runsc --version | sed -n '1p'
          rt="$(docker info --format '{{json .Runtimes}}')"; echo "$rt"; grep -q '"runsc"' <<<"$rt"
          docker run --rm --runtime=runsc alpine:3 dmesg | sed -n '1,3p'

      # M9 §0.7: sandboxes run as the host uid:gid (sandbox_user()), so pytest runs as the default
      # runner user (uid 1001) with no chown. Its primary gid is the `docker` group: harmless,
      # sandboxes get no Docker socket and the gid only tags files in the workspace.
      - name: Prepare test environment
        run: |
          set -euo pipefail
          echo "LOG=$RUNNER_TEMP/m8-ci-pytest.log" >> "$GITHUB_ENV"
          echo "JUNIT=$RUNNER_TEMP/m8-ci-junit.xml" >> "$GITHUB_ENV"
          echo "UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pkgcache"
          # `runner` context is not allowed in job-level env; set it here.
          echo "SWF_PKGCACHE_DIR=$RUNNER_TEMP/pkgcache" >> "$GITHUB_ENV"
          echo "runner: $(id)"

      # test_m8_host_isolation's gateway:22 case only means something if the host listens on 22.
      - name: Ensure a host listener on port 22
        run: |
          set -euo pipefail
          if ! ss -ltn | grep -qE '[:.]22\s'; then
            echo "no sshd listening; installing openssh-server for the gateway:22 case"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq openssh-server
            sudo systemctl start ssh
          fi
          ss -ltn | grep -E '[:.]22\s'

      # Red evidence (informational): without the rule a sandbox may reach the host via its gateway.
      - name: Host isolation before the firewall rule (expected to fail, not gating)
        continue-on-error: true
        run: |
          env PYTHONDONTWRITEBYTECODE=1 SWF_SANDBOX_RUNTIME=runsc \
            "$UV_BIN" run --locked pytest -o addopts="" -q -rs tests/test_m8_host_isolation.py

      - name: Host firewall rule (as ops/vm-bootstrap.sh, m8 §0.14)
        run: |
          set -euo pipefail
          sudo iptables -C INPUT -i br-+ -j DROP 2>/dev/null || sudo iptables -I INPUT 1 -i br-+ -j DROP
          sudo ip6tables -C INPUT -i br-+ -j DROP 2>/dev/null || sudo ip6tables -I INPUT 1 -i br-+ -j DROP
          sudo iptables -S INPUT | sed -n '1,5p'

      - name: Non-live suite under runsc
        timeout-minutes: 35
        run: |
          set -uo pipefail
          { uname -m; docker info --format '{{json .Runtimes}}'; runsc --version | sed -n '1p'; git -c safe.directory="$GITHUB_WORKSPACE" log --oneline -1; } | tee "$LOG"
          env PYTHONDONTWRITEBYTECODE=1 SWF_SANDBOX_RUNTIME=runsc \
            "$UV_BIN" run --locked pytest -o addopts="" -q -m "not live and not e2e" -rs --junitxml="$JUNIT" 2>&1 | tee -a "$LOG"
          exit "${PIPESTATUS[0]}"

      - name: gVisor, workspace-owner and pkgcache Docker tests ran (not skipped)
        if: always()
        run: |
          set -euo pipefail
          python3 ops/ci_check_junit.py "$JUNIT"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-gvisor-pytest-log
          path: |
            ${{ env.LOG }}
            ${{ env.JUNIT }}
          if-no-files-found: warn

      - name: No leftover containers
        if: always()
        run: |
          set -euo pipefail
          left="$(docker ps -a --filter label=swf.test=1 --format '{{.Names}}'; docker ps -a --filter label=swf.managed=1 --format '{{.Names}}')"
          echo "leftovers: ${left:-none}"
          [ -z "$left" ]
