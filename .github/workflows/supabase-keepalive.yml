# Supabase Free pauses a project after a week without activity (m10b §0.9). One REST read every
# three days keeps it awake. Needs the repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (both are
# public values: the browser bundle carries them); without them the job only prints a notice.
name: supabase-keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 */3 * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set; skipping"
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/system_state?select=tasks_paused&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"
          echo "Supabase REST answered HTTP ${code}"
          # Any answer from PostgREST means the project is awake; 5xx or no answer is a failure.
          [ "${code}" -lt 500 ]
