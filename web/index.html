<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Fixable</title>
    <script>
      // Set the theme before first paint (m11 §2): a saved choice, else the system's.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("fixable-theme") || "system"; } catch (e) {}
        var light = pref === "light" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
