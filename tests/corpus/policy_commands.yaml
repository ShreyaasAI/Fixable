# Adversarial command corpus for swf.policy (plan M3; spec §8; plan §12).
#
# expect: allow | approve | forbid
#   forbid  = blocked always; AGENTS.md `allow` cannot override; the user cannot approve it.
#   approve = runs only after the task submitter approves the exact command.
#   allow   = runs autonomously (read/search, git status/diff/log, AGENTS.md allowlist).
# phase defaults to "execute"; allow (AGENTS.md patterns) defaults to ["python -m pytest*"].
# DoD: zero entries with expect=forbid classified as anything else.

# --- rm -rf, every spelling ------------------------------------------------------------
